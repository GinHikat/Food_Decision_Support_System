[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restaurant-menu-dss"
version = "0.1.0"
description = "Decision Support System for Restaurant Menu Engineering and Multi-Criteria Optimization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Decision Support System Group", email = "dss-group@hust.edu.vn" }
]
keywords = [
    "decision-support-system",
    "menu-engineering",
    "hospitality",
    "mcdm",
    "topsis",
    "ahp",
    "restaurant-analytics"
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.7.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.9.0",
]

[project.scripts]
dev = "demo.main:main"
demo = "demo.main:main"

[tool.hatch.build.targets.wheel]
packages = ["demo"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
